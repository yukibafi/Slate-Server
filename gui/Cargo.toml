[package]
name = "create-panel-app"
version = "0.2.10"
edition = "2021"
description = "Create Panel desktop app (Slint). Talks to the engine in ../ (the create-panel binary)."

[[bin]]
name = "create-panel-app"
path = "src/main.rs"

[dependencies]
slint = { version = "1.8", features = ["image-default-formats"] }
create-panel = { path = ".." }

[build-dependencies]
slint-build = "1.8"

[profile.release]
opt-level = 3
lto = true
strip = true

# Not part of the engine's build: the engine crate stays std-only.
[workspace]
